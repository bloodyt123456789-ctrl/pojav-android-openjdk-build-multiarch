
name: Build OpenJDK 21 for Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch32", "aarch64", "x86", "x86_64"]
      fail-fast: false

    name: "Build Java 21 for Android ${{ matrix.arch }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev

      - name: Build with CI build script
        run: |
          export TARGET_VERSION=21
          bash "1_ci_build_arch_${{ matrix.arch }}.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: jdk21-${{ matrix.arch }}
          path: jdk21*.tar.xz
          if-no-files-found: error

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: jre21-${{ matrix.arch }}
          path: jre21*.tar.xz
          if-no-files-found: error

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: jre21-debuginfo-${{ matrix.arch }}
          path: dizout
          if-no-files-found: warn

  pojav:
    needs: build_android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt -y install zip

      - name: Get jre21-aarch32
        uses: actions/download-artifact@v4
        with:
          name: jre21-aarch32
          path: pojav

      - name: Get jre21-aarch64
        uses: actions/download-artifact@v4
        with:
          name: jre21-aarch64
          path: pojav

      - name: Get jre21-x86
        uses: actions/download-artifact@v4
        with:
          name: jre21-x86
          path: pojav

      - name: Get jre21-x86_64
        uses: actions/download-artifact@v4
        with:
          name: jre21-x86_64
          path: pojav

      - name: Repack JRE
        run: |
          export TARGET_VERSION=21
          bash "9_repackjre.sh" "$GITHUB_WORKSPACE/pojav" "$GITHUB_WORKSPACE/pojav/jre21-pojav"
          zip -j -r "$GITHUB_WORKSPACE/jre21-pojav.zip" "$GITHUB_WORKSPACE/pojav/jre21-pojav/"

      - name: Upload Pojav JRE artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre21-pojav
          path: jre21-pojav.zip
          if-no-files-found: error
          retention-days: 7
          
